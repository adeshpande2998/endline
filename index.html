<!doctype html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#2b6a8c">

<title>Endline tablet task (prototype)</title>
<style>
:root{--bg:#f4f1ea;--ink:#1d2733;--mut:#5b6672;--card:#fff;--line:#d8d2c4;--blue:#2b6a8c;--blue2:#dde9f0;--red:#b2452b;--red2:#f3dad2;--ok:#2f7d4f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;font-size:20px;touch-action:manipulation;user-select:none}
#app{max-width:900px;margin:0 auto;min-height:100dvh;padding:10px 14px 16px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}
h1{font-size:30px;margin:6px 0 0}h2{font-size:24px;margin:0}
p{margin:0;line-height:1.45}.mut{color:var(--mut)}.big{font-size:42px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:60px;padding:0 26px;border-radius:14px;border:2px solid var(--blue);background:var(--blue);color:#fff;font-size:22px;font-weight:700;cursor:pointer}
.btn.sec{background:#fff;color:var(--blue)}.btn.red{background:var(--red);border-color:var(--red)}.btn.off{background:#e3e0d8;border-color:#e3e0d8;color:#9a9a9a;pointer-events:none}

.spacer{flex:1}
input[type=text],input[type=number]{font-size:26px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;width:100%}
.opt{padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:20px;cursor:pointer}
.opt.sel{border-color:var(--blue);background:var(--blue2)}
.digits{font-size:min(64px,11.5vw);letter-spacing:min(10px,1.6vw);font-weight:700;text-align:center;padding:24px;font-variant-numeric:tabular-nums}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto}
.keypad .btn{min-height:68px}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--blue2);color:var(--blue);font-weight:700;font-size:16px}

.prior{display:flex;gap:5px;width:100%;max-width:520px}.prior i{flex:1;height:34px;border-radius:6px;display:block;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.prior i.on{background:#d9543a}.prior i:not(.on){background:#2f6fb0}.ans{background:#fff!important;color:var(--ink)!important;border:3px solid #cfd6dc!important;gap:14px}.ans .dot{width:34px;height:34px;border-radius:50%;display:inline-block}.ans .dot.r{background:#d9543a}.ans .dot.b{background:#2f6fb0}
.segs{display:flex;gap:8px;align-items:flex-end}.seg{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--mut);align-items:flex-start}.seg b{display:block;height:8px;width:60px;border-radius:4px;background:#d6d1c4;overflow:hidden}.seg b i{display:block;height:100%;background:var(--blue)}.seg.cur{color:var(--ink);font-weight:700}
.coins{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:100%;max-width:150px;margin:0 auto}
.coins.big{grid-template-columns:repeat(10,1fr);max-width:420px;gap:5px}
.coins i{aspect-ratio:3/4;border-radius:3px 3px 5px 5px;background:linear-gradient(#c9892a 0 14%,#eab94c 14%);border:2px solid #b07a1f;display:block}
.coins i.gone{background:transparent;border:2px dashed #c9c3b3}
.tray i:not(.gone){cursor:pointer}.tray i.gone{cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.oc{border:3px solid var(--line);background:#fff;border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;cursor:pointer}
.oc.sel{border-color:var(--ink);background:#f1eee4}.oc.dim{opacity:.4}.oc.still{pointer-events:none;cursor:default}
.oc .hd{font-size:22px;font-weight:700}.oc .num{font-size:28px;font-weight:700}.oc p{font-size:18px}
.pic{width:84px;height:84px;border-radius:16px;background:#efe9da;display:flex;align-items:center;justify-content:center;font-size:52px;overflow:hidden}.pic.lg{width:150px;height:150px;font-size:96px}.pic img{width:100%;height:100%;object-fit:cover}
.mini{display:flex;gap:6px;justify-content:center}.mini i{width:10px;height:10px;border-radius:50%;background:#d6d1c4;display:block}.mini i.on{background:var(--ink)}
.cards8{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.cards8 i{width:44px;height:60px;border-radius:8px;background:#cfd6dc;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;color:#fff}.cards8 i.pk{background:var(--ink);transform:translateY(-8px)}
svg{max-width:100%;height:auto}:root{--pic:min(calc(100vw - 44px),calc(100dvh - 400px),520px)}.trialsvg{width:var(--pic);height:var(--pic)}
.trial{display:flex;flex-direction:column;gap:8px;align-items:center}.trial .row{flex-wrap:nowrap;gap:10px}.trial .btn.ans{font-size:19px}
.tray.sq i{aspect-ratio:1/1;border-radius:5px}.coins i.lab{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#5a3d0b;aspect-ratio:1/1}
.cmp{display:flex;flex-direction:column;gap:6px;flex:1}.cmp div{padding:6px 10px;border-radius:12px;font-size:21px;font-weight:700}.cmp .g{background:var(--blue2);color:var(--blue)}.cmp .k{background:#f6ead0;color:#7a5a12}.cmp small{font-size:14px;font-weight:600;margin-left:6px;white-space:nowrap}
.cal{width:170px;border:3px solid #cfc8b6;border-radius:14px;overflow:hidden;background:#fff;text-align:center}.cal .hd{background:var(--red);color:#fff;font-size:26px;font-weight:700;padding:6px}.cal .bd{font-size:54px;font-weight:700;padding:10px 0}.cal .sb{font-size:16px;color:var(--mut);padding-bottom:10px}
@media (orientation:landscape) and (max-height:520px){:root{--pic:min(calc(100dvh - 120px),360px)}.trial2{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}}

.err{color:var(--red);font-weight:700}
.admin{position:fixed;right:8px;bottom:8px;font-size:12px;color:var(--mut)}
.admin a{color:var(--mut);margin-left:10px}

<body>
<div id="app"></div>
<div class="admin"><a href="#" id="adm-export">export</a><a href="#" id="adm-reset">reset</a></div>
<script>
"use strict";
/* ===================== CONFIG (edit here) ===================== */
const CONFIG = {
  appVersion: "proto-1.2",
  languages: [["en","English"],["hi","हिन्दी"],["mr","मराठी"]],   // UI strings currently English only; see STR
  load: "memory",              // UNDECIDED (design v6): working memory or inhibitory control, to be chosen from the lab-in-field results. Only "memory" is built; it is the default.
  digitsInLoad: 7,
  digitBonusRs: 5,             // lab pays Rs5 if recalled exactly; set 0 to drop

  picturesPerBlock: 5,
  priorsPerBlock: [3,5,5,5,7], // boxes in 10 with more red; shuffled within block

  revealAtEnd: true,         // slider mode: last screen says the price picked and whether she gets all her dal or an item + dal (never which item)

  practicePrices: [2,5,9,14],

           position:"before_shop", // "before_shop" (between Toy Box and the shop; decided 24 Nov) or "after_shop". Same for every arm.
           seconds:120, practiceSeconds:15, paisePerPoint:10, showCount:false},   // placeholders: calibrate in the pilot
  dropbox: {appKey:"wlwjj1xece9pe5m"},                       // public app key; the refresh token is pasted on each tablet, never stored in this file
  vault: {url:"", token:"", headerName:"Authorization"},       // data goes directly to the vault; address and auth still to be provided
  items: {                      // placeholder wording; replace after piloting
    easyDeck:  {icon:"🃏",name:"Deck of easy cards", desc:"24 cards with simple things to do, such as 'Find something purple.'"},
    openDeck:  {icon:"💬",name:"Deck of open-ended cards", desc:"24 cards with questions to talk about, such as 'Why do different people have different jobs?'"},
    childSnack:{icon:"🍫",name:"Snack bundle for your child", desc:"3 packets of chips and 3 chocolates. (Confirm contents with the field team. Never show a price here: it would anchor what parents push.)"},
    schoolGood:{icon:"✏️",name:"School supplies bundle", desc:"6 pencils, 2 notebooks and a sharpener. (Confirm contents with the field team. Never show a price here: it would anchor what parents push.)"},
    game:      {icon:"🎲",name:"Snakes and ladders game", desc:"A game to play with your child for 5 to 10 minutes a day"},
    practice:  {icon:"🥦",name:"Cauliflower", desc:""},
    practice2: {icon:"🪥",name:"Tube of toothpaste", desc:""},
    practice3: {icon:"🔦",name:"Torch", desc:""}
  }
};
/* Translatable strings. Add hi/mr objects with the same keys and recorded audio later. */
const STR = {
 en:{begin:"Begin", next:"Next", play:"Play", red:"MORE RED", blue:"MORE BLUE", take:"Take it", keep:"Keep my dal"},
 /* DRAFT labels written by Claude. A native Hindi / Marathi speaker must check before any field use. */
 hi:{begin:"शुरू करें", next:"आगे", play:"फिर से सुनें", red:"लाल ज़्यादा", blue:"नीला ज़्यादा", take:"लेना है", keep:"दाल रखूँगा"},
 mr:{begin:"सुरू करा", next:"पुढे", play:"पुन्हा ऐका", red:"लाल जास्त", blue:"निळे जास्त", take:"घ्यायचे आहे", keep:"डाळ ठेवतो"}
};
const T = k => (STR[S.lang]||STR.en)[k] || STR.en[k] || k;

/* ===================== seeded RNG ===================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng = Math.random;
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick = a => a[Math.floor(rng()*a.length)];

/* ===================== state + persistence ===================== */
const KEY="endline_tablet_state_v1";
let S = null;
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} }
function load(){ try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null} }
const el = document.getElementById("app");
const h = (tag,attrs,...kids)=>{const e=document.createElement(tag);for(const k in (attrs||{})){if(k==="class")e.className=attrs[k];else if(k==="html")e.innerHTML=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k])}for(const c of kids.flat()){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e};

/* ===================== IndexedDB: audio files + finished sessions ===================== */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("endline_tablet",2);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("a"))d.createObjectStore("a");if(!d.objectStoreNames.contains("s"))d.createObjectStore("s")};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const LSK=store=>"endline_fallback_"+store;
function lsGet(store){try{return JSON.parse(localStorage.getItem(LSK(store))||"{}")}catch(e){return {}}}
async function dbPut(store,key,val){
  try{const d=await idb();return await new Promise((res,rej)=>{const t=d.transaction(store,"readwrite");t.objectStore(store).put(val,key);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
  catch(e){ if(store==="a")return;   // audio blobs cannot be kept without IndexedDB
    const o=lsGet(store);o[key]=val;try{localStorage.setItem(LSK(store),JSON.stringify(o))}catch(e2){} }
}
async function dbAll(store){
  try{const d=await idb();return await new Promise((res,rej)=>{const o={};const c=d.transaction(store).objectStore(store).openCursor();c.onsuccess=e=>{const cu=e.target.result;if(cu){o[cu.key]=cu.value;cu.continue()}else res(o)};c.onerror=()=>rej(c.error)})}
  catch(e){return store==="a"?{}:lsGet(store)}
}
let AUDIO={};
async function refreshAudio(){try{const all=await dbAll("a");Object.values(AUDIO).forEach(u=>URL.revokeObjectURL(u));AUDIO={};for(const k in all)AUDIO[k]=URL.createObjectURL(all[k])}catch(e){}}
/* One sentence per page. The enumerator keeps pressing Next / Back until the parent has understood. */
const INFO_PAGES=[
 // --- Toy Box (group "tb"), shown before the practice; "tbload" pages are shown once, before the first round with a number to remember
 {key:"tb_welcome",  group:"tb", text:"Welcome. Today you will do three short activities.", visual:"welcome"},
 {key:"tb_money",    group:"tb", text:"In each activity you can earn money. You will be given your winnings at the end of the school year, in March.", visual:"march"},
 {key:"tb_box",      group:"tb", text:"In the first activity, you will see a box of balls.", visual:"tbbox"},
 {key:"tb_task",     group:"tb", text:"You decide whether the box has more red balls or more blue balls.", visual:"tbbuttons"},
 {key:"tb_bar",      group:"tb", text:"The row of small squares shows how many of 10 boxes like this have more red balls.", visual:"tbbar"},
 {key:"tb_pay1",     group:"tb", text:"You earn money for every correct answer."},
 {key:"tb_pay2",     group:"tb", text:"In some rounds each correct answer earns Rs 1, and in other rounds Rs 4."},
 {key:"tb_practice", group:"tb", text:"First, some practice pictures, where nothing is real and the tablet tells you if you were right."},
 {key:"tb_real",     group:"tbreal", text:"Now the real rounds begin."},
 {key:"tb_load1",    group:"tbload", text:"In some rounds of the real activity, you will first see a number.", visual:"digits"},
 {key:"tb_load2",    group:"tbload", text:"Remember the number while you look at the pictures.", visual:"digits"},
 {key:"tb_load3",    group:"tbload", text:"At the end of the round, type the number you saw."},
 {key:"tb_load4",    group:"tbload", text:"If you type it exactly right, you earn Rs 5 more. First, one practice with a number."},
 // --- tapping task (group "ef")
 {key:"ef_intro",    group:"ef", text:"Now a tapping task. You can earn money for every correct tap.", visual:"efbuttons"},
 {key:"ef_how",      group:"ef", text:"You will see two big buttons, A and B.", visual:"efbuttons"},
 {key:"ef_how2",     group:"ef", text:"Tap A, then B, then A, then B, again and again, as fast as you can.", visual:"efseq"},
 {key:"ef_rule",     group:"ef", text:"A tap only counts if it is the other letter. Tapping the same letter twice in a row earns nothing.", visual:"efrule"},
 {key:"ef_pay",      group:"ef", text:"Each correct tap earns you "+CONFIG.effort.paisePerPoint+" paise, so the more you tap, the more you earn. You will be paid in March."},
 {key:"ef_time",     group:"ef", text:"The real task lasts "+Math.round(CONFIG.effort.seconds/60)+" minutes.", visual:"clock"},
 {key:"ef_practice", group:"ef", text:"First, a practice of "+CONFIG.effort.practiceSeconds+" seconds, where nothing is real."},
 {key:"ef_real",     group:"efreal", text:"Now the real task begins."},
 // --- trading shop (no group)
 {key:"shop_intro", text:"Now the last activity, with dal."},
 {key:"tokens",   text:"In this part, you have 20 packets of dal.", visual:"coins"},
 {key:"dal",      text:"Each packet is 25 grams, so you have half a kilo of dal.", visual:"dal"},
 {key:"item",     text:"You can give some of your dal packets to get an item.", visual:"item"},
 // --- choices mode
 {key:"prices",   mode:"choices", text:"You will see one price at a time, and for each price you choose whether to take it or keep your dal.", visual:"example"},
 {key:"noright",  mode:"choices", text:"There is no right or wrong answer."},
 {key:"random1",  mode:"choices", text:"Later, the tablet will pick just ONE of your choices at random.", visual:"pickone"},
 {key:"random2",  mode:"choices", text:"Only that one choice is real, and what you chose there is what happens.", visual:"pickone"},
 {key:"random3",  mode:"choices", text:"You will not know which choice it will be, so answer every choice as if it is the real one."},
 // --- slider mode
 {key:"push",     mode:"slider", text:"For each item, push across the packets of dal you would be willing to give for it.", visual:"push"},
 {key:"pull",     mode:"slider", text:"You can push more, or pull some back, and when it feels right, press Done.", visual:"push"},
 {key:"noright_s", mode:"slider", text:"There is no right or wrong answer."},
 {key:"random1s", mode:"slider", text:"At the end, the tablet picks just ONE of the items at random.", visual:"pickone"},
 {key:"price1",   mode:"slider", text:"Then the tablet picks its own price for that item.", visual:"price"},
 {key:"price2",   mode:"slider", text:"If the price is the same as or less than what you pushed, you get the item.", visual:"win"},
 {key:"price3",   mode:"slider", text:"If the price is more than what you pushed, you get no item.", visual:"lose"},
 {key:"best",     mode:"slider", text:"So push exactly as much as you would truly give, because pushing less may lose the item, and pushing more may cost too much."},
 {key:"random3s", mode:"slider", text:"We do not know which item it will be. The tablet decides. So answer for every item as if it is the real one."},
 // --- both
 {key:"when1",    text:"The tablet picks at the end, after you have finished all of them."},
 {key:"when2",    text:"The dal and the item will be given to you in March.", visual:"march"},
 {key:"practice", text:"First, let us practise, where nothing is real.", visual:"item"},
 {key:"real",     text:"Now come the real ones, and one of them will really happen."}
];
const AUDIO_KEYS=["intro","tb_practice_intro","tb_block_start_rs1","tb_block_start_rs4","tb_block_start_rs1_load","tb_block_start_rs4_load","tb_digits_show","tb_digits_recall","tb_done","pl_demo_draw","pl_comprehension","pl_list_practice","pl_list_practice2","pl_list_practice3","pl_list_easyDeck","pl_list_openDeck","pl_list_childSnack","pl_list_schoolGood","pl_list_game","effort_intro","effort_end","tb_block_start_rs1_practice","tb_block_start_rs4_practice","tb_digits_practice","thanks"].concat(INFO_PAGES.map(i=>"info_"+i.key));
function audioKey(step){
  const m=step.meta||{};
  if(step.id==="tb_block_start")return "tb_block_start_rs"+m.stake+(m.load?"_load":"");
  if(step.id==="info")return "info_"+m.key;
  if(step.id==="pl_item_intro")return "pl_list_"+m.key;
  return AUDIO_KEYS.includes(step.id)?step.id:null;
}
let curAudio=null;
function stopAudio(){if(curAudio){try{curAudio.pause()}catch(e){}curAudio=null}}
function audioBar(step){
  const key=audioKey(step);if(!key)return null;
  const url=AUDIO[key+"_"+S.lang],bar=h("div",{class:"row",style:"justify-content:flex-end"});
  if(!url){if(S.showMissing)bar.append(h("span",{class:"mut",style:"font-size:13px"},"[no audio: "+key+"_"+S.lang+"]"));return bar}
  const au=new Audio(url);curAudio=au;let n=0;
  au.addEventListener("ended",()=>ev("audio_end",{key}));
  const play=auto=>{n++;ev("audio_play",{key,n,auto:!!auto});au.currentTime=0;au.play().catch(()=>ev("audio_blocked",{key}))};
  bar.append(h("button",{class:"btn sec","data-id":"audio",style:"min-height:48px;font-size:18px",onclick:()=>play(false)},"🔊 "+T("play")));
  if(S.autoplay)setTimeout(()=>play(true),60);
  return bar;
}

/* ===================== logging ===================== */
let cur=null;
function enterScreen(step){
  cur={step_index:S.cursor,screen:step.id,module:step.module||"",meta:step.meta||{},t_enter_wall:new Date().toISOString(),t0:performance.now(),events:[]};
}
function ev(type,data){ if(cur) cur.events.push({type,t_ms:Math.round(performance.now()-cur.t0),...(data||{})}); }
function leaveScreen(resp){
  stopAudio();
  if(!cur) return;
  const rec={step_index:cur.step_index,screen:cur.screen,module:cur.module,meta:cur.meta,t_enter_wall:cur.t_enter_wall,t_leave_wall:new Date().toISOString(),duration_ms:Math.round(performance.now()-cur.t0),n_events:cur.events.length,events:cur.events,response:resp===undefined?null:resp};
  S.screens.push(rec); cur=null; save();
}
document.addEventListener("visibilitychange",()=>ev("visibility",{hidden:document.hidden}));
document.addEventListener("pointerdown",e=>{ if(cur) ev("tap",{x:Math.round(e.clientX),y:Math.round(e.clientY),target:(e.target.dataset&&e.target.dataset.id)||e.target.className||e.target.tagName}) },true);

/* ===================== toy box pictures ===================== */
function makePicture(prior, layout){
  const N=CONFIG.balls, maj=CONFIG.majority, min=N-maj;
  const boxes=[...Array(prior).fill("red"),...Array(10-prior).fill("blue")];   // the 10 boxes of this kind; one is drawn at random, with replacement
  const truth = boxes[Math.floor(rng()*10)];
  const nRed = truth==="red"?maj:min;
  const W=300,H=300,R=CONFIG.ballR, pts=[];
  let guard=0;
  while(pts.length<N && guard++<20000){const x=R+4+rng()*(W-2*R-8),y=R+4+rng()*(H-2*R-8);if(pts.every(p=>(p.x-x)**2+(p.y-y)**2>(2*R+2)**2))pts.push({x,y});}
  let colors;
  if(layout==="scattered"){colors=shuffle(Array.from({length:N},(_,i)=>i<nRed?"red":"blue"));}
  else{ // clustered: reds on one side, along a random axis
    const ang=rng()*Math.PI*2,ax=Math.cos(ang),ay=Math.sin(ang);
    const order=pts.map((p,i)=>({i,s:p.x*ax+p.y*ay})).sort((a,b)=>a.s-b.s);
    colors=Array(N).fill("blue");order.slice(0,nRed).forEach(o=>colors[o.i]="red");
  }
  return {prior,layout,truth,nRed,balls:pts.map((p,i)=>({x:p.x,y:p.y,c:colors[i]}))};
}
function drawPicture(pic,small){

/* ===================== build the step list (deterministic from seed) ===================== */
function buildSteps(){
  const st=[];
  const add=(id,module,meta)=>st.push({id,module,meta:meta||{}});
  const pg=(k,mod)=>add("info",mod,{key:k});
  INFO_PAGES.filter(p=>p.group==="tb").forEach(p=>pg(p.key,"toybox"));
  // --- Toy box practice: note the pay, two pictures (the box type and the prior change between them), twice; then the number
  const pracRound=(stake,specs,t0)=>{add("tb_block_start","toybox",{practice:true,stake});
    specs.forEach(([lay,k],i)=>add("tb_trial","toybox",{practice:true,stake,pic:makePicture(k,lay),trial:t0+i,ptotal:4}))};
  pracRound(1,[["scattered",5],["clustered",7]],1);
  pracRound(4,[["clustered",3],["scattered",5]],3);
  INFO_PAGES.filter(p=>p.group==="tbload").forEach(p=>pg(p.key,"toybox"));
  {const dg=Array.from({length:CONFIG.digitsInLoad},()=>Math.floor(rng()*10)).join("");
   add("tb_digits_show","toybox",{practice:true,digits:dg});
   add("tb_trial","toybox",{practice:true,pic:makePicture(7,"scattered"),trial:5,ptotal:5,withNumber:true});
   add("tb_digits_recall","toybox",{practice:true,digits:dg});}
  pg("tb_real","toybox");
  // --- 8 blocks: layout x load x stakes, 5 pictures each, random order
  const cells=[];
  for(const load of [0,1])for(const lay of ["clustered","scattered"])for(const stake of CONFIG.stakesRs)cells.push({load,layout:lay,stake});
  const order=shuffle(cells);
  S.blockOrder=order;
  order.forEach((c,bi)=>{
    add("tb_block_start","toybox",{block:bi+1,load:c.load,stake:c.stake,layout:c.layout});
    let digits=null;
    if(c.load){digits=Array.from({length:CONFIG.digitsInLoad},()=>Math.floor(rng()*10)).join("");add("tb_digits_show","toybox",{block:bi+1,digits});}
    const pri=shuffle(CONFIG.priorsPerBlock);
    pri.forEach((k,ti)=>add("tb_trial","toybox",{block:bi+1,trial:ti+1,load:c.load,stake:c.stake,layout:c.layout,pic:makePicture(k,c.layout)}));
    if(c.load)add("tb_digits_recall","toybox",{block:bi+1,digits});
  });
  add("tb_done","toybox");
  const addEffort=()=>{
    INFO_PAGES.filter(p=>p.group==="ef").forEach(p=>pg(p.key,"effort"));
    add("effort_task","effort",{practice:true});
    add("effort_end","effort",{practice:true});
    pg("ef_real","effort");
    add("effort_task","effort",{});
    add("effort_end","effort",{});
  };
  if(CONFIG.effort.enabled&&CONFIG.effort.position==="before_shop")addEffort();
  // --- trading shop: info pages, practice, demo draw, quiz, then 5 real lists. One price per screen, random order.
  S.takeLeft=rng()<0.5;                       // side of the "take it" card (choices mode), fixed for the whole session
  S.shopMode=CONFIG.shopMode;
  const infos=INFO_PAGES.filter(p=>!p.group&&((p.mode||"both")==="both"||p.mode===S.shopMode));
  infos.filter(p=>p.key!=="real").forEach(p=>add("info","ladder",{key:p.key}));
  const lists=shuffle(["easyDeck","openDeck","childSnack","schoolGood","game"]);   // all five in random order
  S.listOrder=lists.slice();
  if(S.shopMode==="slider"){
    ["practice","practice2","practice3"].forEach(k=>add("pl_slider","ladder",{key:k,practice:true}));
    add("pl_demo_draw","ladder");
    add("pl_comprehension","ladder");
    add("info","ladder",{key:"real"});
    lists.forEach(k=>add("pl_slider","ladder",{key:k}));
  }else{
    const pp=shuffle(CONFIG.practicePrices);
    add("pl_item_intro","ladder",{key:"practice",practice:true,n:pp.length});
    pp.forEach((pr,i)=>add("pl_choice","ladder",{key:"practice",practice:true,price:pr,pos:i+1,n:pp.length}));
    add("pl_demo_draw","ladder");
    add("pl_comprehension","ladder");
    add("info","ladder",{key:"real"});
    lists.forEach(k=>{
      const pr=shuffle(CONFIG.shopPrices);
      add("pl_item_intro","ladder",{key:k,n:pr.length});
      pr.forEach((x,i)=>add("pl_choice","ladder",{key:k,price:x,pos:i+1,n:pr.length}));
    });
  }
  if(CONFIG.effort.enabled&&CONFIG.effort.position!=="before_shop")addEffort();
  add("thanks","payout");
  return st;
}

  const rows=[hdr.join(",")];
  list.forEach(s=>s.screens.forEach(r=>rows.push([s.pid,r.step_index,r.screen,r.module,r.t_enter_wall,r.t_leave_wall,r.duration_ms,r.n_events,JSON.stringify(r.response)].map(q).join(","))));
  return rows.join("\n");
}
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.append(a);a.click();setTimeout(()=>a.remove(),500)}
async function buildPackage(includeSent){
  const all=await dbAll("s"),keys=Object.keys(all).filter(k=>includeSent||!all[k].sent);
  const list=keys.map(k=>all[k].data);
  const stamp=new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
  return {keys,list,stamp,json:JSON.stringify({exportedAt:new Date().toISOString(),appVersion:CONFIG.appVersion,sessions:list}),csv:csvOf(list)};
}
async function markSent(keys){for(const k of keys){const all=await dbAll("s");if(all[k]){all[k].sent=true;await dbPut("s",k,all[k])}}}

/* ---------- Dropbox upload (PKCE, app-folder, write only) ---------- */
const DBX={
  redirect:()=>location.origin+location.pathname,
  get rt(){try{return localStorage.getItem("dbx_rt")||""}catch(e){return ""}},
  set rt(v){try{v?localStorage.setItem("dbx_rt",v):localStorage.removeItem("dbx_rt")}catch(e){}},
  at:"",atExp:0,
  b64u(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")},
  async connect(){
    const v=DBX.b64u(crypto.getRandomValues(new Uint8Array(48)));
    const ch=DBX.b64u(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
    try{sessionStorage.setItem("dbx_v",v)}catch(e){}
    location.href="https://www.dropbox.com/oauth2/authorize?"+new URLSearchParams({client_id:CONFIG.dropbox.appKey,response_type:"code",code_challenge:ch,code_challenge_method:"S256",token_access_type:"offline",redirect_uri:DBX.redirect()});
  },
  async finishConnect(){
    const q=new URLSearchParams(location.search),code=q.get("code");if(!code)return null;
    let v="";try{v=sessionStorage.getItem("dbx_v")||""}catch(e){}
    history.replaceState(null,"",location.pathname);
    try{
      const r=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({code,grant_type:"authorization_code",code_verifier:v,client_id:CONFIG.dropbox.appKey,redirect_uri:DBX.redirect()})});
      const j=await r.json();if(!r.ok||!j.refresh_token)return "Dropbox did not accept the login: "+(j.error_description||j.error||r.status);
      DBX.rt=j.refresh_token;DBX.at=j.access_token;DBX.atExp=Date.now()+(j.expires_in-60)*1000;return "ok";
    }catch(e){return "No connection to Dropbox."}
  },
  async token(){
    if(DBX.at&&Date.now()<DBX.atExp)return DBX.at;
    const r=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({grant_type:"refresh_token",refresh_token:DBX.rt,client_id:CONFIG.dropbox.appKey})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||"token");
    DBX.at=j.access_token;DBX.atExp=Date.now()+(j.expires_in-60)*1000;return DBX.at;
  },
  async put(path,text){
    const t=await DBX.token();
    const r=await fetch("https://content.dropboxapi.com/2/files/upload",{method:"POST",headers:{"Authorization":"Bearer "+t,"Content-Type":"application/octet-stream","Dropbox-API-Arg":JSON.stringify({path,mode:"add",autorename:true,mute:true})},body:new Blob([text])});
    if(!r.ok)throw new Error("upload "+r.status);
  }
};
async function uploadPending(){
  if(DBX.rt){
    const all=await dbAll("s");let ok=0,fail=0;
    for(const k of Object.keys(all)){ if(all[k].sent)continue;
      try{const base=k.replace(/[^A-Za-z0-9_.-]/g,"-");
        await DBX.put("/"+base+".json",JSON.stringify(all[k].data));
        await DBX.put("/"+base+"_screens.csv",csvOf([all[k].data]));
        all[k].sent=true;all[k].sentAt=new Date().toISOString();await dbPut("s",k,all[k]);ok++}catch(e){fail++}}
    return {ok,fail};
  }
  const V=CONFIG.vault;if(!V.url)return {skipped:true};
  const all=await dbAll("s");let ok=0,fail=0;
  for(const k of Object.keys(all)){ if(all[k].sent)continue;
    try{const hd={"Content-Type":"application/json"};if(V.token)hd[V.headerName||"Authorization"]=V.token;
      const r=await fetch(V.url,{method:"POST",headers:hd,body:JSON.stringify({key:k,session:all[k].data})});
      if(r.ok){all[k].sent=true;all[k].sentAt=new Date().toISOString();await dbPut("s",k,all[k]);ok++}else fail++;
    }catch(e){fail++}}
  return {ok,fail};
}
window.addEventListener("online",()=>{uploadPending()});
async function showSendPanel(note){
  const pk=await buildPackage(false);
  const msg=h("p",{class:"mut"},pk.list.length+" finished session(s) not yet uploaded."+((CONFIG.vault.url||DBX.rt)?"":" Dropbox not connected on this tablet."));
  const box=h("div",{class:"card",style:"display:flex;flex-direction:column;gap:12px"},note?h("h2",{},note):h("h2",{},"Data"),msg);
  box.append(btn("Upload to Dropbox now",async()=>{const r=await uploadPending();msg.textContent=r.skipped?"Dropbox is not connected on this tablet yet (see below).":r.ok+" uploaded, "+r.fail+" failed (no connection?). Failed ones stay on the tablet."}));
  box.append(btn("Back up a copy to this tablet (download)",async()=>{const all=await buildPackage(true);download("endline_all_"+all.stamp+".json",all.json,"application/json");setTimeout(()=>download("endline_all_screens_"+all.stamp+".csv",all.csv,"text/csv"),400)},"sec"),btn("Back to start",()=>setup(),"sec"));
  const dst=h("p",{class:"mut"},DBX.rt?"Dropbox: connected on this tablet.":"Dropbox: not connected.");
  const code=h("input",{type:"text",placeholder:"Paste setup code here",style:"font-size:16px;padding:10px;border:2px solid var(--line);border-radius:10px;width:100%"});
  box.append(h("h2",{},"Dropbox setup"),dst,
    btn("Connect Dropbox (researcher login)",()=>DBX.connect(),"sec"),
    btn("Copy setup code for other tablets",async()=>{if(!DBX.rt){dst.textContent="Connect first.";return}const c=btoa(JSON.stringify({k:CONFIG.dropbox.appKey,r:DBX.rt}));try{await navigator.clipboard.writeText(c);dst.textContent="Setup code copied."}catch(e){code.value=c;dst.textContent="Copy the code from the box below."}},"sec"),
    code,
    btn("Use this setup code on this tablet",()=>{try{const j=JSON.parse(atob(code.value.trim()));if(j.k!==CONFIG.dropbox.appKey||!j.r)throw 0;DBX.rt=j.r;DBX.at="";dst.textContent="Dropbox: connected on this tablet.";code.value=""}catch(e){dst.textContent="That code does not work."}},"sec"),
    btn("Disconnect Dropbox on this tablet",()=>{DBX.rt="";DBX.at="";dst.textContent="Dropbox: not connected."},"sec"));
  el.innerHTML="";el.append(box);
}
document.getElementById("adm-export").onclick=e=>{e.preventDefault();showSendPanel()};
document.getElementById("adm-reset").onclick=e=>{e.preventDefault();if(confirm("Delete the UNFINISHED session on this tablet? Finished sessions are kept.")){localStorage.removeItem(KEY);S=null;setup()}};

function render(){
  if(S.cursor>=S.steps.length){return}
  const step=S.steps[S.cursor];
  // after resume, per-step content is stored in S.steps, so pictures/digits do not change
  enterScreen(step);
  SCREENS[step.id](step);
}
window.__app={get S(){return S},quiz:()=>S.shopMode==="slider"?QUIZ_S:QUIZ,render,CONFIG,dbAll,showSendPanel,buildPackage,uploadPending,maxToyboxRs};
(async()=>{const r=await DBX.finishConnect();await refreshAudio();setup();if(r){await showSendPanel(r==="ok"?"Dropbox connected":r)}})();
